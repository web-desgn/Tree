<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nələr öyrənmişəm</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#4f7a5a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f3f1ec;--dot:#d3d6cf;--fg:#2b2f2c;--mut:#6b726d;--line:#9aa89d;--card:#fff;--bd:#d6dad3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1e1c;--dot:#2c322e;--fg:#e6eae5;--mut:#9aa39c;--line:#5b6a5f;--card:#252a26;--bd:#38403a}}
:root[data-theme="dark"]{--bg:#1b1e1c;--dot:#2c322e;--fg:#e6eae5;--mut:#9aa39c;--line:#5b6a5f;--card:#252a26;--bd:#38403a}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font:14px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#cv{position:absolute;inset:0;touch-action:none;background-image:radial-gradient(var(--dot) 1.5px,transparent 1.5px);background-size:22px 22px}
#w{position:absolute;left:0;top:0}
#ed{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible}
.e{fill:none;stroke:var(--line);stroke-width:2.5}
.nd{position:absolute;width:150px;height:46px;background:var(--card);border:1.5px solid var(--bd);border-left:6px solid var(--c);border-radius:10px;padding:5px 9px;display:flex;align-items:center;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
.nd span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.nd.sel{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 30%,transparent)}
#top{position:absolute;left:0;right:0;top:env(safe-area-inset-top,0px);padding:8px 14px;color:var(--mut);font-size:12.5px;pointer-events:none}
#zm{position:absolute;right:12px;bottom:calc(150px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}#zm button{width:44px;height:44px;font-size:24px;border-radius:12px;border:1.5px solid var(--bd);background:var(--card);color:var(--fg)}
#bar{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;flex-wrap:wrap}
#bar input{flex:1 1 100%;font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--bd);background:var(--bg);color:var(--fg)}
#bar button{flex:1;font:inherit;font-weight:600;padding:10px;border-radius:10px;border:1.5px solid var(--bd);background:var(--bg);color:var(--fg)}
#bar .add{background:#4f7a5a;border-color:#4f7a5a;color:#fff}
</style>
</head>
<body>
<div id="cv"><div id="w"><svg id="ed"></svg></div></div>
<div id="top">Fonu sürüşdür: hərəkət. Qutunu sürüşdür: yerini dəyiş. Qutuya toxun, aşağıda yaz.</div>
<div id="zm"><button id="zi">+</button><button id="zo">−</button></div>
<div id="bar">
<input id="in" placeholder="Seçilmiş qutunun mətni">
<button class="add" id="add">+ Budaq</button>
<button id="del">Sil</button>
<button id="rs">Sıfırla</button>
</div>
<script>
var W=150,H=46,PAL=["#4f7a5a","#8a6f4d","#5b6f8f","#8a5b6f","#6f7a4f","#6b7fa0"],K="agac_v1";
function init(){var a=[{id:1,t:"Mən",x:30,y:240,p:0,c:PAL[0]}],i=2;
var B=[["Bacarıqlar",["Sayt qurmaq","Telegram bot","n8n","Sheets və Gmail"]],["Qurduğum sistem",["/text əmri","Approve və email"]],["Sınadıqlarım",["Dropshipping","100+ klinika","Viber zəngləri"]],["Qaydalar",["TCPA","CAN-SPAM"]]];
var y=30;B.forEach(function(b,k){var c=PAL[k+1],id=i++;a.push({id:id,t:b[0],x:230,y:y,p:1,c:c});
b[1].forEach(function(l,j){a.push({id:i++,t:l,x:430,y:y+j*54-(b[1].length-1)*27+(b[1].length>1?0:0),p:id,c:c})});y+=Math.max(120,b[1].length*54+10)});
return {n:a,sel:1,nx:i,px:0,py:0}}
var S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}if(!S||!S.n)S=init();
var cv=document.getElementById("cv"),w=document.getElementById("w"),ed=document.getElementById("ed"),inp=document.getElementById("in"),els={};
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function get(id){return S.n.filter(function(n){return n.id==id})[0]}
function pan(){w.style.transformOrigin="0 0";w.style.transform="translate("+S.px+"px,"+S.py+"px) scale("+(S.z||1)+")"}
function edges(){var h="";S.n.forEach(function(n){var p=get(n.p);if(!p)return;var x1=p.x+W,y1=p.y+H/2,x2=n.x,y2=n.y+H/2,c=Math.max(40,Math.abs(x2-x1)/2);h+='<path class="e" d="M'+x1+' '+y1+' C'+(x1+c)+' '+y1+','+(x2-c)+' '+y2+','+x2+' '+y2+'"/>'});ed.innerHTML=h}
function sel(id){S.sel=id;for(var k in els)els[k].classList.toggle("sel",k==id);var n=get(id);inp.value=n?n.t:"";save()}
function draw(){for(var k in els)els[k].remove();els={};
S.n.forEach(function(n){var d=document.createElement("div");d.className="nd";d.style.cssText="left:"+n.x+"px;top:"+n.y+"px;--c:"+n.c;d.innerHTML="<span></span>";d.firstChild.textContent=n.t;w.appendChild(d);els[n.id]=d;
d.addEventListener("pointerdown",function(e){e.stopPropagation();d.setPointerCapture(e.pointerId);sel(n.id);var sx=e.clientX,sy=e.clientY,ox=n.x,oy=n.y;
function mv(ev){n.x=ox+(ev.clientX-sx)/(S.z||1);n.y=oy+(ev.clientY-sy)/(S.z||1);d.style.left=n.x+"px";d.style.top=n.y+"px";edges()}
function up(){d.removeEventListener("pointermove",mv);d.removeEventListener("pointerup",up);save()}
d.addEventListener("pointermove",mv);d.addEventListener("pointerup",up)})});
edges();sel(S.sel);pan()}
var P={};
function zoomAt(f,cx,cy){var z=S.z||1,nz=Math.min(2.5,Math.max(0.3,z*f));f=nz/z;S.px=cx-(cx-S.px)*f;S.py=cy-(cy-S.py)*f;S.z=nz;pan()}
cv.addEventListener("pointerdown",function(e){if(e.target.closest(".nd"))return;cv.setPointerCapture(e.pointerId);P[e.pointerId]={x:e.clientX,y:e.clientY}});
cv.addEventListener("pointermove",function(e){var o=P[e.pointerId];if(!o)return;var ids=Object.keys(P);
if(ids.length==2){var q=P[ids[0]==e.pointerId?ids[1]:ids[0]],d0=Math.hypot(o.x-q.x,o.y-q.y),d1=Math.hypot(e.clientX-q.x,e.clientY-q.y);if(d0>0)zoomAt(d1/d0,(e.clientX+q.x)/2,(e.clientY+q.y)/2)}
else{S.px+=e.clientX-o.x;S.py+=e.clientY-o.y;pan()}
o.x=e.clientX;o.y=e.clientY});
function pu(e){delete P[e.pointerId];save()}
cv.addEventListener("pointerup",pu);cv.addEventListener("pointercancel",pu);
cv.addEventListener("wheel",function(e){e.preventDefault();zoomAt(e.deltaY<0?1.1:0.9,e.clientX,e.clientY)},{passive:false});
document.getElementById("zi").onclick=function(){zoomAt(1.25,innerWidth/2,innerHeight/2)};
document.getElementById("zo").onclick=function(){zoomAt(0.8,innerWidth/2,innerHeight/2)};
inp.addEventListener("input",function(){var n=get(S.sel);if(!n)return;n.t=inp.value;els[n.id].firstChild.textContent=n.t;save()});
document.getElementById("add").onclick=function(){var p=get(S.sel)||S.n[0],k=S.n.filter(function(n){return n.p==p.id}).length;
var c=p.id==1?PAL[(S.n.filter(function(n){return n.p==1}).length+1)%PAL.length]:p.c;
var n={id:S.nx++,t:"Yeni",x:p.x+200,y:p.y+k*56,p:p.id,c:c};S.n.push(n);S.sel=n.id;draw();inp.focus();inp.select()};
document.getElementById("del").onclick=function(){if(S.sel==1)return;var rm={};rm[S.sel]=1;var ch=true;while(ch){ch=false;S.n.forEach(function(n){if(!rm[n.id]&&rm[n.p]){rm[n.id]=1;ch=true}})}
S.n=S.n.filter(function(n){return !rm[n.id]});S.sel=1;draw()};
var rb=document.getElementById("rs");rb.onclick=function(){if(rb.dataset.a){S=init();delete rb.dataset.a;rb.textContent="Sıfırla";draw();return}rb.dataset.a=1;rb.textContent="Əminsən? Bir daha toxun";setTimeout(function(){delete rb.dataset.a;rb.textContent="Sıfırla"},3000)};
draw();
if('serviceWorker' in navigator){try{navigator.serviceWorker.register('sw.js')}catch(e){}}
</script>
</body>
</html>
